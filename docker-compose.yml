name: tests-quizzes

services:
  db:
    image: postgres:16-alpine
    container_name: tests-quizzes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    ports:
      # Хост-порт можно переопределить в .env (DB_PORT), если 5432 занят.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Создаёт quiz_test при первом запуске с пустым томом.
      # Для существующего тома — npm run db:test:up.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
