name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz_test?schema=public
      DATABASE_URL_TEST: postgresql://quiz:quiz@localhost:5432/quiz_test?schema=public
      # Тестовый секрет, не боевой. CI не требует настоящих секретов (AC-QA-05).
      AUTH_SECRET: ci-test-secret-0123456789-abcdefghijklmnop
      APP_URL: http://localhost:3000
      MAIL_TRANSPORT: log
      LEGAL_TERMS_VERSION: 2026-11-09-draft
      LEGAL_PRIVACY_VERSION: 2026-11-09-draft

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Сразу после установки: lint/typecheck/build импортируют сгенерированный клиент.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations to quiz_test
        run: npm run db:deploy

      - name: Build
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
